# Gate Lighthouse para pull requests (Backlog 3, item H).
# Roda em todo PR aberto ou atualizado. Reprova se uma categoria estiver abaixo do mínimo ou se uma
# auditoria crítica falhar. Não há exceções de dívida conhecida em lighthouse/limiares.json: só as
# falhas de rede do host que o próprio gate bloqueia deixam de contar como erro de console.
# Para bloquear o merge, marque o check "Lighthouse (PR)" como obrigatório na proteção da branch main
# (Settings → Branches → Require status checks).
name: Lighthouse

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código do PR
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      # Impede que css/nexus.css, css/fonts.css, fonts/ ou vendor/ fiquem fora de sincronia com as
      # dependências instaladas (as páginas não usam CDN).
      - name: Recursos locais em dia
        run: node tools/assets.js --check

      # O Chrome já vem instalado nas imagens ubuntu-latest; o gate o localiza no PATH.
      - name: Build de produção e gate Lighthouse
        run: npm run lighthouse

      - name: Relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14
