# Configuração mínima do projeto para a Supabase CLI.
# Use:
#   supabase link --project-ref <ref-do-projeto>
#   supabase db push                                  (aplica supabase/migrations/*)
#   supabase functions deploy panic-alert --no-verify-jwt
#   supabase functions deploy relatorio-pdf --no-verify-jwt

project_id = "nexusport"

# panic-alert: o app não usa Supabase Auth (sessão própria via codigo_individual),
# então o gateway NÃO deve exigir JWT. Com verify_jwt ligado, o gateway responde 401
# ao preflight CORS (OPTIONS não envia Authorization), e o navegador bloqueia a
# chamada com "Response to preflight request doesn't pass access control check".
# A autorização real é feita dentro da função (RBAC por cargo).
[functions.panic-alert]
verify_jwt = false

# relatorio-pdf: mesma situação do panic-alert. O app não usa Supabase Auth; a identidade
# (codigo_individual, funcionário ativo e cargo permitido) é validada dentro da função.
[functions.relatorio-pdf]
verify_jwt = false

# Seed de demonstração (Backlog 3, itens C e D): usuários mock por cargo e dados fictícios de navios,
# contêineres, cargas e histórico. `supabase db reset` roda este arquivo localmente. Não aplicar em produção.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
